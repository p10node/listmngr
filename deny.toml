[advisories]
yanked = "deny"
unmaintained = "workspace"
# RUSTSEC-2023-0071 (Marvin attack, `rsa`): a timing side channel in RSA
# *private-key* operations. The only `rsa` use in this tree is `webauthn_rp`
# verifying RS256 passkey signatures with the credential's *public* key; no
# RSA private key exists in listmngr. The same id is ignored in the
# `cargo audit` gate (CLAUDE.md). Re-evaluate when `rsa` publishes a fix.
ignore = [{ id = "RUSTSEC-2023-0071", reason = "public-key signature verification only (webauthn_rp); no RSA private-key operation in listmngr" }]

[licenses]
allow = [
  "AGPL-3.0-or-later",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
allow-wildcard-paths = false

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[package]
name = "listmngr-import"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[package.metadata.listmngr]
delivery-phase = 6

[lints]
workspace = true

[dependencies]
listmngr-core = { path = "../core", version = "0.1.0" }
listmngr-db = { path = "../db", version = "0.1.0" }
listmngr-mail = { path = "../mail", version = "0.1.0" }
chrono.workspace = true
regex.workspace = true
reqwest = { workspace = true, features = ["json", "rustls-tls-webpki-roots"] }
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
sqlx = { workspace = true, features = ["any"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[package]
name = "listmngr"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Link the example plugin into the binary, to see the wiring work.
plugin-example = ["listmngr-plugins/example"]

[dependencies]
hickory-resolver = "=0.26.2"
hyper = { workspace = true, features = ["http1", "http2", "server"] }
hyper-util = { workspace = true, features = ["server", "server-auto", "tokio", "http1", "http2", "service"] }
tokio-rustls = { version = "=0.26.5", default-features = false, features = ["ring", "tls12"] }
rustls-acme = { version = "=0.15.4", default-features = false, features = ["ring", "tls12", "webpki-roots"] }
webpki-roots = "=1.0.9"
futures.workspace = true
tower.workspace = true
flate2.workspace = true
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
chrono.workspace = true
listmngr-api = { path = "../api", version = "0.1.0" }
listmngr-archive = { path = "../archive", version = "0.1.0" }
listmngr-core = { path = "../core", version = "0.1.0" }
listmngr-db = { path = "../db", version = "0.1.0" }
listmngr-import = { path = "../import", version = "0.1.0" }
listmngr-mail = { path = "../mail", version = "0.1.0" }
listmngr-runners = { path = "../runners", version = "0.1.0" }
listmngr-plugins = { path = "../plugins", version = "0.1.0" }
listmngr-pipeline = { path = "../pipeline", version = "0.1.0" }
serde_json.workspace = true
rpassword.workspace = true
reqwest.workspace = true
sqlx = { workspace = true, features = ["any"] }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
tempfile = "3.23.0"

[dev-dependencies]
sha2.workspace = true
rustls-pki-types = "=1.15.1"
tokio-rustls = { version = "=0.26.5", default-features = false, features = ["ring", "tls12"] }
assert_cmd = "2.1.1"
predicates = "3.1.3"
base64.workspace = true
mail-auth = { version = "=0.12.1", default-features = false, features = ["ring"] }

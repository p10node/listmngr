[package]
name = "listmngr-runners"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[package.metadata.listmngr]
delivery-phase = 2

[lints]
workspace = true

[dependencies]
listmngr-archive = { path = "../archive", version = "1.2.1" }
listmngr-core = { path = "../core", version = "1.2.1" }
listmngr-db = { path = "../db", version = "1.2.1" }
listmngr-mail = { path = "../mail", version = "1.2.1" }
listmngr-pipeline = { path = "../pipeline", version = "1.2.1" }
chrono.workspace = true
mail-parser = "=0.11.8"
sqlx = { workspace = true, features = ["any"] }
tokio = { workspace = true, features = ["io-util", "time", "sync", "signal", "net", "rt"] }
tracing.workspace = true
uuid.workspace = true
regex.workspace = true
serde_json.workspace = true
rand.workspace = true
hmac.workspace = true
sha2.workspace = true
reqwest = { workspace = true, features = ["rustls-tls-webpki-roots"] }
url = "=2.5.4"

[dev-dependencies]
tokio-rustls = { version = "=0.26.5", default-features = false, features = ["ring", "tls12"] }
mail-auth = { version = "=0.12.1", default-features = false, features = ["ring"] }
base64.workspace = true
listmngr-api = { path = "../api", version = "1.2.1" }
axum.workspace = true
tower.workspace = true
tokio = { workspace = true, features = ["io-util", "time", "sync", "signal", "net", "rt", "test-util"] }
tempfile = "3.23.0"

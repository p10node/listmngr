{% extends "base.html" %}
{% import "macros.html" as ui %}
{% block content %}<p>{{ shell.t("web-signup-intro") }}</p><form method="post" action="/web/signup">{% call ui::csrf(csrf) %}{% endcall %}<p><label>{{ shell.t("web-signup-email") }} <input type="email" name="email" autocomplete="email" required maxlength="320"></label></p><p><label>{{ shell.t("web-signup-display-name") }} <input name="display_name" autocomplete="name" required maxlength="256"></label></p><p><label>{{ shell.t("web-signup-password") }} <input type="password" name="password" autocomplete="new-password" required maxlength="1024"></label></p><p><label>{{ shell.t("web-signup-confirm") }} <input type="password" name="confirm_password" autocomplete="new-password" required maxlength="1024"></label></p><p>{{ shell.t("web-signup-note") }}</p><button>{{ shell.t("web-signup-submit") }}</button></form><p><a href="/web/login">{{ shell.t("web-signup-have-account") }}</a></p>{% endblock %}

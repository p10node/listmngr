{% extends "base.html" %}
{% import "macros.html" as ui %}
{% block content %}<p>{{ shell.t("web-profile-intro") }}</p><form method="post" action="/web/account/profile">{% call ui::csrf(csrf) %}{% endcall %}<p><label for="display_name">{{ shell.t("web-profile-display-name") }}</label><input id="display_name" name="display_name" value="{{ display_name }}" maxlength="256" required></p><p><label for="locale">{{ shell.t("web-profile-locale") }}</label><select id="locale" name="locale">{% call ui::options(locales.as_slice()) %}{% endcall %}</select></p><p><label for="timezone">{{ shell.t("web-profile-timezone") }}</label><select id="timezone" name="timezone">{% call ui::options(timezones.as_slice()) %}{% endcall %}</select></p><p>{{ shell.t("web-profile-note") }}</p><button>{{ shell.t("web-profile-save") }}</button></form><p><a href="/web/account">{{ shell.t("web-title-account") }}</a></p>{% endblock %}

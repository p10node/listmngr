{% extends "base.html" %}
{% import "macros.html" as ui %}
{% block content %}<form method="post" action="/web/login">{% call ui::csrf(csrf) %}{% endcall %}<p><label>{{ shell.t("web-login-email") }} <input type="email" name="email" autocomplete="username" required></label></p><p><label>{{ shell.t("web-login-password") }} <input type="password" name="password" autocomplete="current-password" required maxlength="1024"></label></p><button>{{ shell.t("web-login-submit") }}</button></form><p><button type="button" id="passkey-login" hidden>{{ shell.t("web-login-passkey") }}</button> <span id="passkey-login-status" aria-live="polite" data-working="{{ shell.t("web-passkeys-working") }}" data-failed="{{ shell.t("web-passkeys-failed") }}"></span></p><p><a href="/web/reset">{{ shell.t("web-login-reset") }}</a>{% if signup %} · <a href="/web/signup">{{ shell.t("web-login-signup") }}</a>{% endif %}</p><p>{{ shell.t("web-login-help") }}</p>{% endblock %}

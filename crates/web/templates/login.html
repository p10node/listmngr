{% extends "base.html" %}
{% import "macros.html" as ui %}
{% block content %}<form method="post" action="/web/login">{% call ui::csrf(csrf) %}{% endcall %}<p><label>{{ shell.t("web-login-email") }} <input type="email" name="email" autocomplete="username" required></label></p><p><label>{{ shell.t("web-login-password") }} <input type="password" name="password" autocomplete="current-password" required maxlength="1024"></label></p><button>{{ shell.t("web-login-submit") }}</button></form><p>{{ shell.t("web-login-no-signup") }}</p>{% endblock %}

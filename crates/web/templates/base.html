<!doctype html><html lang="{{ shell.language() }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="/web/style.css"><title>{{ shell.title() }} · listmngr</title>{% if shell.htmx() %}<meta name="htmx-config" content='{"includeIndicatorStyles":false}'><script src="/web/htmx.min.js" defer></script>{% endif %}{% if let Some(script) = shell.script() %}<script src="{{ script }}" defer></script>{% endif %}</head><body><a class="skip" href="#main">{{ shell.t("web-skip-to-content") }}</a><header><a class="brand" href="/web">listmngr</a><nav aria-label="{{ shell.t("web-nav-label") }}">{% for item in shell.navigation() %}<a href="{{ item.href }}"{% if item.current %} aria-current="page"{% endif %}>{{ item.label }}</a>{% endfor %}</nav></header><main id="main"><h1>{{ shell.title() }}</h1>{% block content %}{% endblock %}</main><footer>{{ shell.t("web-footer") }}</footer></body></html>

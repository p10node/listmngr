{% extends "base.html" %}
{% import "macros.html" as ui %}
{% block content %}<form method="post" action="/web/account/password">{% call ui::csrf(csrf) %}{% endcall %}<p><label>{{ shell.t("web-password-current") }} <input type="password" name="current_password" autocomplete="current-password" maxlength="1024" required></label></p><p><label>{{ shell.t("web-password-new") }} <input type="password" name="new_password" autocomplete="new-password" maxlength="1024" required></label></p><p><label>{{ shell.t("web-password-confirm") }} <input type="password" name="confirm_password" autocomplete="new-password" maxlength="1024" required></label></p><p>{{ shell.t("web-password-signs-out") }}</p><button>{{ shell.t("web-password-submit") }}</button></form>{% endblock %}

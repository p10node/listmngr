[package]
name = "listmngr-archive"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[package.metadata.listmngr]
delivery-phase = 2

[lints]
workspace = true

[dependencies]
listmngr-core = { path = "../core", version = "1.2.1" }
listmngr-db = { path = "../db", version = "1.2.1" }
listmngr-mail = { path = "../mail", version = "1.2.1" }
listmngr-pipeline = { path = "../pipeline", version = "1.2.1" }
reqwest = { workspace = true, features = ["json", "rustls-tls-webpki-roots"] }
mail-parser = "=0.11.8"
pulldown-cmark = { version = "0.13.4", default-features = false }
tantivy = "0.26.2"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# The archivers spawn an operator's command and write a maildir.
tokio = { workspace = true, features = ["process", "fs", "io-util"] }
tracing.workspace = true

[dev-dependencies]
tokio.workspace = true
sqlx = { workspace = true, features = ["any"] }
tempfile = "=3.27.0"

[package]
name = "listmngr-mail"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[package.metadata.listmngr]
delivery-phase = 2

[lints]
workspace = true

[dependencies]
base64.workspace = true
tokio-rustls = { version = "=0.26.5", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "=1.0.9"
mail-auth = { version = "=0.12.1", default-features = false, features = ["ring"] }
rustls-pki-types = "=1.15.1"
mail-parser = "=0.11.8"
regex.workspace = true
mail-builder = { version = "=0.5.0", default-features = false }
listmngr-core = { path = "../core", version = "0.1.0" }
listmngr-i18n = { path = "../i18n", version = "0.1.0" }
listmngr-pipeline = { path = "../pipeline", version = "0.1.0" }
sha1 = "=0.10.7"
sha2.workspace = true
thiserror.workspace = true
tempfile = "=3.27.0"
tokio = { workspace = true, features = ["io-util", "time"] }
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "time", "test-util", "macros", "rt-multi-thread"] }

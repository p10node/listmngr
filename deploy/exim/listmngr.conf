# Exim 4 integration for listmngr. Include (or paste) into the main
# configuration after `listmngr aliases regen` (or the server) has published
# `/var/lib/listmngr/mta/current/` from `[mta] incoming = "exim"`; grant the
# Exim user read access (`map_permissions = "group"` plus group membership).
#
# In the main section:
#
#   domainlist relay_to_domains = lsearch;/var/lib/listmngr/mta/current/exim_domains
#
# The default `acl_check_rcpt` then accepts recipients in these domains only
# after `verify = recipient`, which runs the routers below, so unknown
# addresses are refused at RCPT rather than bounced.

# --- routers (place before dnslookup) ---

listmngr_lists:
  driver = manualroute
  domains = lsearch;/var/lib/listmngr/mta/current/exim_domains
  # Every exact posting, command and bounce address is in the file. A VERP
  # bounce (list-bounces+local=domain) is looked up without its extension;
  # any other plus extension is refused by the router below.
  local_part_suffix = +*
  local_part_suffix_optional
  condition = ${if and{ \
      {eq{${lookup{$local_part@$domain}lsearch{/var/lib/listmngr/mta/current/exim_recipients}{found}}}{found}} \
      {or{{eq{$local_part_suffix}{}} \
          {and{{match{$local_part}{\N-bounces$\N}}{match{$local_part_suffix}{\N^\+[^@=]+=[^@=]+$\N}}}}}} \
    }}
  # listmngr usually listens on this host; `self = send` lets Exim deliver
  # to its own address over LMTP.
  route_list = * 127.0.0.1
  self = send
  transport = listmngr_lmtp
  no_more

listmngr_unknown:
  driver = redirect
  domains = lsearch;/var/lib/listmngr/mta/current/exim_domains
  allow_fail
  data = :fail: no such list address

# --- transports ---

listmngr_lmtp:
  driver = smtp
  protocol = lmtp
  port = 8024
  hosts_avoid_tls = *
  # Hand the full address (with any VERP extension) to listmngr.
  rcpt_include_affixes

# Activation gate on the deployment host:
#   exim -bV
#   exim -bt list@example.org           # routes to listmngr_lmtp
#   exim -bt list-bounces+a=b@example.org
#   exim -bt nobody@example.org         # fails: no such list address
#   exim -bt list+detail@example.org    # fails
# Reload only after generated maps and end-to-end acceptance pass.

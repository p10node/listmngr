services:
  postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_USER: listmngr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in an env file}
      POSTGRES_DB: listmngr
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U listmngr -d listmngr"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
  listmngr:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      LISTMNGR__DATABASE__URL: postgres://listmngr:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in an env file}@postgres:5432/listmngr
      LISTMNGR__WEB__LISTEN: 0.0.0.0:8000
      LISTMNGR__SITE__BASE_URL: ${LISTMNGR_BASE_URL:-http://127.0.0.1:8000}
      # Mail role: LMTP from the postfix service only (never published), maps
      # for it under the shared volume, outbound through it as a trusted
      # plaintext relay on the private network.
      LISTMNGR__MTA__ENABLED: "true"
      LISTMNGR__MTA__LOCAL_HOSTNAME: ${LISTMNGR_MAIL_HOSTNAME:-lists.example.invalid}
      LISTMNGR__MTA__LMTP_LISTEN: 0.0.0.0:8024
      LISTMNGR__MTA__LMTP_MAP_TARGET: 172.28.0.10:8024
      LISTMNGR__MTA__INCOMING: postfix
      LISTMNGR__MTA__MAP_DIRECTORY: /var/lib/listmngr/mta
      LISTMNGR__MTA__SMTP_RELAY: 172.28.0.25:25
      LISTMNGR__MTA__SMTP_TLS: plaintext_trusted_relay
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "127.0.0.1:${LISTMNGR_PORT:-8000}:8000"
    networks:
      default:
        ipv4_address: 172.28.0.10
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,uid=1000,gid=1000
    volumes:
      - mta-maps:/var/lib/listmngr/mta
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/listmngr", "status"]
      interval: 5s
      timeout: 3s
      retries: 12
  postfix:
    build:
      context: ..
      dockerfile: deploy/postfix/Dockerfile
    environment:
      POSTFIX_MYHOSTNAME: ${LISTMNGR_MAIL_HOSTNAME:-lists.example.invalid}
      POSTFIX_MYNETWORKS: 172.28.0.0/24
      # Optional smart host, e.g. "[smtp.example.invalid]:587"; empty means
      # direct MX delivery from this container.
      POSTFIX_RELAYHOST: ${POSTFIX_RELAYHOST:-}
    ports:
      - "${POSTFIX_SMTP_LISTEN:-0.0.0.0:25}:25"
    networks:
      default:
        ipv4_address: 172.28.0.25
    depends_on:
      listmngr:
        condition: service_healthy
    volumes:
      - mta-maps:/var/lib/listmngr/mta:ro
      - postfix-spool:/var/spool/postfix
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - FSETID
      - KILL
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "postfix", "status"]
      interval: 10s
      timeout: 3s
      retries: 6

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  postgres-data:
  mta-maps:
  postfix-spool:

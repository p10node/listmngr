{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "listmngr.fullname" . }}
  labels:
    {{- include "listmngr.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "listmngr.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - ports:
        - port: 8000
          protocol: TCP
        {{- if .Values.service.lmtp.enabled }}
        - port: {{ .Values.service.lmtp.port }}
          protocol: TCP
        {{- end }}
      {{- with .Values.networkPolicy.webFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- if .Values.postgresql.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "listmngr.postgresqlSelectorLabels" . | nindent 14 }}
      ports:
        - port: 5432
          protocol: TCP
    {{- end }}
    {{- with .Values.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- if .Values.postgresql.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "listmngr.postgresqlName" . }}
  labels:
    {{- include "listmngr.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  podSelector:
    matchLabels:
      {{- include "listmngr.postgresqlSelectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "listmngr.selectorLabels" . | nindent 14 }}
      ports:
        - port: 5432
          protocol: TCP
  egress: []
{{- end }}
{{- end }}

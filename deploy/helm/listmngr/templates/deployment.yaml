{{- include "listmngr.databaseCheck" . -}}
{{- include "listmngr.mtaCheck" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "listmngr.fullname" . }}
  labels:
    {{- include "listmngr.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "listmngr.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "listmngr.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secrets: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "listmngr.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if or .Values.migrate.enabled (include "listmngr.hasSecretFiles" .) .Values.postgresql.enabled }}
      initContainers:
        {{- if .Values.postgresql.enabled }}
        - name: wait-db
          image: {{ include "listmngr.postgresqlImage" . }}
          imagePullPolicy: {{ .Values.postgresql.image.pullPolicy }}
          command: ["sh", "-c"]
          args:
            - i=0; until pg_isready -h {{ include "listmngr.postgresqlName" . }} -p 5432 -U {{ .Values.postgresql.auth.username }} -q; do i=$((i + 1)); [ "$i" -lt 60 ] || exit 1; sleep 2; done
          securityContext:
            {{- toYaml .Values.postgresql.securityContext | nindent 12 }}
        {{- end }}
        {{- if include "listmngr.hasSecretFiles" . }}
        - name: secret-files
          image: {{ .Values.secretFilesImage }}
          command: ["sh", "-c"]
          args:
            - for f in /secrets-in/*; do [ -f "$f" ] && install -m 0400 "$f" /etc/listmngr/secrets/; done
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: secret-files-in
              mountPath: /secrets-in
              readOnly: true
            - name: secrets
              mountPath: /etc/listmngr/secrets
        {{- end }}
        {{- if .Values.migrate.enabled }}
        - name: migrate
          image: {{ include "listmngr.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--config", "/etc/listmngr/listmngr.toml", "migrate"]
          envFrom:
            - secretRef:
                name: {{ include "listmngr.secretName" . }}
          {{- with (include "listmngr.databaseEnv" . | trim) }}
          env:
            {{- . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/listmngr/listmngr.toml
              subPath: listmngr.toml
              readOnly: true
            - name: secrets
              mountPath: /etc/listmngr/secrets
              readOnly: true
            - name: state
              mountPath: /var/lib/listmngr
        {{- end }}
      {{- end }}
      containers:
        - name: listmngr
          image: {{ include "listmngr.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--config", "/etc/listmngr/listmngr.toml", "serve"]
          ports:
            - name: http
              containerPort: 8000
            {{- if .Values.service.lmtp.enabled }}
            - name: lmtp
              containerPort: {{ .Values.service.lmtp.port }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "listmngr.secretName" . }}
          {{- if or .Values.postgresql.enabled .Values.mta.enabled .Values.env }}
          env:
            {{- with (include "listmngr.databaseEnv" . | trim) }}
            {{- . | nindent 12 }}
            {{- end }}
            {{- with (include "listmngr.mtaEnv" . | trim) }}
            {{- . | nindent 12 }}
            {{- end }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/listmngr/listmngr.toml
              subPath: listmngr.toml
              readOnly: true
            - name: secrets
              mountPath: /etc/listmngr/secrets
              readOnly: true
            - name: state
              mountPath: /var/lib/listmngr
            - name: tmp
              mountPath: /tmp
        {{- if .Values.mta.enabled }}
        - name: postfix
          image: {{ include "listmngr.mtaImage" . }}
          imagePullPolicy: {{ .Values.mta.image.pullPolicy }}
          env:
            - name: POSTFIX_MYHOSTNAME
              value: {{ .Values.mta.hostname | quote }}
            # Only this pod relays through the sidecar: the application on loopback.
            - name: POSTFIX_MYNETWORKS
              value: "127.0.0.0/8"
            - name: POSTFIX_RELAYHOST
              value: {{ .Values.mta.relayhost | quote }}
          ports:
            - name: smtp
              containerPort: 25
          # The entrypoint waits for the first map generation before Postfix
          # starts, so readiness also says "the maps are there".
          readinessProbe:
            exec:
              command: ["postfix", "status"]
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["postfix", "status"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
          securityContext:
            {{- toYaml .Values.mta.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.mta.resources | nindent 12 }}
          volumeMounts:
            - name: state
              mountPath: /var/lib/listmngr
              readOnly: true
            - name: spool
              mountPath: /var/spool/postfix
        {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "listmngr.fullname" . }}
        - name: secrets
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        {{- if include "listmngr.hasSecretFiles" . }}
        - name: secret-files-in
          secret:
            secretName: {{ include "listmngr.filesSecretName" . }}
        {{- end }}
        - name: state
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ default (include "listmngr.fullname" .) .Values.persistence.existingClaim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        {{- if .Values.mta.enabled }}
        - name: spool
          emptyDir:
            sizeLimit: {{ .Values.mta.spool.size }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_USER: listmngr
          POSTGRES_PASSWORD: listmngr-ci-only
          POSTGRES_DB: listmngr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U listmngr -d listmngr"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      TEST_POSTGRES_URL: postgres://listmngr:listmngr-ci-only@127.0.0.1:5432/listmngr
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, pinned 2026-09-04
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: scripts/check-phase0-artifacts.sh
      - run: python3 -m unittest discover -s scripts/tests -v
      - run: python3 scripts/check-production-crates.py
      - run: cargo fmt --all --check
      - run: cargo build --locked --workspace
      - name: Validate hardened Linux unit against the built executable
        run: |
          sudo install -m 0755 target/debug/listmngr /usr/bin/listmngr
          systemd-analyze verify deploy/systemd/listmngr.service
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-targets
      - name: Mandatory PostgreSQL migration and connectivity test
        run: scripts/test-postgres.sh
      - name: Every PostgreSQL-backed test on the same disposable server
        run: scripts/test-postgres-all.sh
      - name: Pinned real mailmanclient against a disposable server
        run: |
          python3 -m venv "$RUNNER_TEMP/mailmanclient"
          . "$RUNNER_TEMP/mailmanclient/bin/activate"
          python3 -m pip install -r tests/compat/requirements-mailmanclient.txt
          python3 scripts/test-mailmanclient.py
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2
      - run: cargo deny check
      # RUSTSEC-2023-0071 is an unfixed rsa crate present only in Cargo.lock via
      # SQLx's disabled MySQL graph; `cargo tree --target all -i rsa` is empty.
      # cargo-deny still checks the active graph and this exception must be
      # removed when SQLx drops the lock-only edge or an rsa fix is published.
      - run: cargo audit --ignore RUSTSEC-2023-0071

  browser:
    # P4-ACCEPTANCE: the Chromium harness (every browser slice) and the
    # phone-viewport journey, with axe-core and Lighthouse accessibility.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, pinned 2026-09-04
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Pinned Playwright, Chromium, axe-core and Lighthouse
        run: |
          python3 -m venv "$RUNNER_TEMP/browser"
          "$RUNNER_TEMP/browser/bin/pip" install playwright==1.55.0
          "$RUNNER_TEMP/browser/bin/playwright" install --with-deps chromium
          curl -sSfo "$RUNNER_TEMP/axe.min.js" https://cdn.jsdelivr.net/npm/axe-core@4.13.0/axe.min.js
          echo "c24f097bd2f451d4f933e8bc7d8d539f8672a2ebcb5cc9f9f3eec8ca9470a0c1  $RUNNER_TEMP/axe.min.js" | sha256sum -c
          npm install --no-audit --no-fund --prefix "$RUNNER_TEMP/lighthouse" lighthouse@13.4.1
      - name: Chromium harness with axe-core
        env:
          WEBUI_BROWSER_SCRIPT: ${{ github.workspace }}/scripts/test-webui-browser.py
        run: |
          WEBUI_BROWSER_PYTHON="$RUNNER_TEMP/browser/bin/python" \
          WEBUI_BROWSER_OUTPUT="$RUNNER_TEMP/browser-evidence" \
          WEBUI_AXE_SCRIPT="$RUNNER_TEMP/axe.min.js" \
            cargo test --locked -p listmngr-api --test webui chromium_browser_acceptance -- --ignored --nocapture
      - name: Acceptance journey at a phone viewport with axe-core and Lighthouse
        env:
          WEBUI_JOURNEY_SCRIPT: ${{ github.workspace }}/scripts/test-webui-journey.py
        run: |
          WEBUI_BROWSER_PYTHON="$RUNNER_TEMP/browser/bin/python" \
          WEBUI_BROWSER_OUTPUT="$RUNNER_TEMP/journey-evidence" \
          WEBUI_AXE_SCRIPT="$RUNNER_TEMP/axe.min.js" \
          WEBUI_LIGHTHOUSE="$RUNNER_TEMP/lighthouse/node_modules/.bin/lighthouse" \
            cargo test --locked -p listmngr-api --test webui chromium_acceptance_journey -- --ignored --nocapture

  acme:
    # P6-WEB-ACME: a certificate ordered from Pebble (Let's Encrypt's ACME
    # test server, resolving through its challenge DNS) over TLS-ALPN-01 on
    # the TLS listener itself, cached owner-only and reused at the next start.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, pinned 2026-09-04
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Pinned Pebble and pebble-challtestsrv
        run: |
          curl -sSfLo "$RUNNER_TEMP/pebble.tar.gz" https://github.com/letsencrypt/pebble/releases/download/v2.10.1/pebble-linux-amd64.tar.gz
          curl -sSfLo "$RUNNER_TEMP/challtestsrv.tar.gz" https://github.com/letsencrypt/pebble/releases/download/v2.10.1/pebble-challtestsrv-linux-amd64.tar.gz
          printf '%s\n' \
            "4f2fcb5bca8c85c9cf73ad140fccfc0d2be40bd81ab99879c79b7b8a0b4f70ed  $RUNNER_TEMP/pebble.tar.gz" \
            "e93a5aa25ecdf3af2f9fbb2de32b0173e64a2eae81002a4ccfe35fa6f4f60b92  $RUNNER_TEMP/challtestsrv.tar.gz" \
            | sha256sum -c
          tar -xzf "$RUNNER_TEMP/pebble.tar.gz" -C "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP/challtestsrv.tar.gz" -C "$RUNNER_TEMP"
          # The release archives carry both binaries as 0644.
          chmod +x "$RUNNER_TEMP/pebble-linux-amd64/linux/amd64/pebble" \
            "$RUNNER_TEMP/pebble-challtestsrv-linux-amd64/linux/amd64/pebble-challtestsrv"
      - name: Certificate ordered over TLS-ALPN-01, cached and reused
        run: |
          TEST_PEBBLE_BIN="$RUNNER_TEMP/pebble-linux-amd64/linux/amd64/pebble" \
          TEST_PEBBLE_CHALLTESTSRV_BIN="$RUNNER_TEMP/pebble-challtestsrv-linux-amd64/linux/amd64/pebble-challtestsrv" \
            cargo test --locked -p listmngr --test web_acme -- --ignored --nocapture

  fuzz:
    # P7-FUZZ: every cargo-fuzz target for sixty seconds on the pinned
    # nightly; a crash fails the job and lands in fuzz/artifacts.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, pinned 2026-09-04
        with:
          toolchain: nightly-2026-09-30
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2
        with:
          tool: cargo-fuzz@0.13.2
      - run: scripts/fuzz.sh 60
      # A crash or leak report names its input under fuzz/artifacts; keep it.
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore
          retention-days: 14

  docs:
    # P7-DOCS-SITE: the book builds, its links resolve, and the generated
    # configuration reference is the source's.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2
        with:
          tool: mdbook@0.5.4
      - run: python3 scripts/config-reference.py --check
      - run: python3 scripts/check-book-links.py
      - run: mdbook build docs/book
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: book
          path: docs/book/book
          retention-days: 14

  helm:
    # P10-HELM-TEST: the chart lints strictly and renders every documented
    # variant, then installs on a disposable kind cluster from the image
    # built here and is exercised as an operator would (scripts/test-helm.sh);
    # the release workflow packages the chart.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
      - run: helm lint --strict deploy/helm/listmngr
      - run: helm template listmngr deploy/helm/listmngr > /dev/null
      - run: helm template listmngr deploy/helm/listmngr --set 'secretFiles.dkim\.pem=KEY' --set ingress.enabled=true > /dev/null
      - run: helm template listmngr deploy/helm/listmngr --set existingSecret=lists-env --set existingFilesSecret=lists-files > /dev/null
      - run: helm template listmngr deploy/helm/listmngr --set persistence.enabled=false --set serviceAccount.create=false > /dev/null
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          version: v0.33.0
          install_only: true
      - run: scripts/test-helm.sh

  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: cp .env.example .env
      - run: docker compose --env-file .env -f deploy/docker-compose.yml config --quiet
      - run: docker compose --env-file .env -f deploy/docker-compose.yml up -d --build --wait
      - run: curl --fail --show-error http://127.0.0.1:8000/healthz
      - run: curl --fail --show-error http://127.0.0.1:8000/readyz
      - if: always()
        run: docker compose --env-file .env -f deploy/docker-compose.yml down -v

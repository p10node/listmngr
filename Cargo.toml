[workspace]
members = ["crates/core", "crates/i18n", "crates/db", "crates/mail", "crates/pipeline", "crates/runners", "crates/archive", "crates/api", "crates/web", "crates/cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1.0.100"
argon2 = "0.5.3"
axum = "0.8.6"
base64 = "0.22.1"
bytes = "1.10.1"
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.5.48", features = ["derive", "env"] }
dashmap = "6.1.0"
figment = { version = "0.10.19", features = ["env", "toml"] }
futures = "0.3.31"
http = "1.3.1"
idna = "1.1.0"
ipnet = { version = "2.11.0", features = ["serde"] }
rand = "0.9.2"
regex = "1.11.2"
reqwest = { version = "=0.12.23", default-features = false }
rpassword = "=7.4.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_urlencoded = "0.7.1"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "sqlite", "chrono", "uuid", "migrate"] }
subtle = "2.6.1"
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "signal", "net"] }
tower = { version = "0.5.2", features = ["util"] }
tower-http = { version = "0.6.6", features = ["cors", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
utoipa = { version = "5.4.0", features = ["axum_extras", "chrono", "uuid"] }
uuid = { version = "1.18.1", features = ["v7", "serde"] }
zxcvbn = "3.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Build-artifact budget. `cargo test --all-targets` links one binary per file in
# `crates/*/tests/`, so full debug info and per-test incremental caches dominate
# `target/`. Line tables keep backtrace file/line resolution for the gates while
# dropping variable-level DWARF; unpacked split-debuginfo keeps object debug data
# out of the linked binaries on macOS.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.test]
debug = "line-tables-only"
incremental = false

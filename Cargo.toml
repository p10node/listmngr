[workspace]
members = ["crates/core", "crates/i18n", "crates/db", "crates/mail", "crates/pipeline", "crates/runners", "crates/archive", "crates/api", "crates/web", "crates/import", "crates/plugins", "crates/cli"]
# The cargo-fuzz targets build on a pinned nightly with their own lock.
exclude = ["fuzz"]
resolver = "2"

[workspace.package]
version = "1.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1.0.100"
argon2 = "0.5.3"
askama = "0.16.1"
axum = "0.8.6"
base64 = "0.22.1"
bytes = "1.10.1"
chrono = { version = "0.4.42", features = ["serde"] }
chrono-tz = "0.10.4"
ciborium = "0.2.2"
clap = { version = "4.5.48", features = ["derive", "env"] }
dashmap = "6.1.0"
figment = { version = "0.10.19", features = ["env", "toml"] }
flate2 = "1.1.10"
futures = "0.3.31"
hmac = "0.12.1"
hyper = { version = "=1.11.1", default-features = false }
hyper-util = { version = "=0.1.20", default-features = false }
http = "1.3.1"
idna = "1.1.0"
ipnet = { version = "2.11.0", features = ["serde"] }
p256 = { version = "0.13.2", default-features = false, features = ["ecdsa", "std"] }
percent-encoding = "2.3.1"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
rand = "0.9.2"
regex = "1.11.2"
reqwest = { version = "=0.12.23", default-features = false }
rpassword = "=7.4.0"
rsa = { version = "0.9.10", default-features = false, features = ["sha2", "std"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_urlencoded = "0.7.1"
sha1 = "0.10.6"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "sqlite", "chrono", "uuid", "migrate"] }
subtle = "2.6.1"
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "signal", "net"] }
tower = { version = "0.5.2", features = ["util"] }
tower-http = { version = "0.6.6", features = ["cors", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
utoipa = { version = "5.4.0", features = ["axum_extras", "chrono", "uuid"] }
uuid = { version = "1.18.1", features = ["v7", "serde"] }
webauthn_rp = { version = "=0.3.0", features = ["serde", "serde_relaxed", "serializable_server_state", "bin"] }
zxcvbn = "3.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Build-artifact budget. `cargo test --all-targets` links one binary per file in
# `crates/*/tests/`, so full debug info and per-test incremental caches dominate
# `target/`. Line tables keep backtrace file/line resolution for the gates while
# dropping variable-level DWARF; unpacked split-debuginfo keeps object debug data
# out of the linked binaries on macOS.
# Release builds keep integer overflow checks: a wrapped counter or length
# is a bug worth a panic, never silent (docs/PLAN.md §5.4).
[profile.release]
overflow-checks = true
# Measured on the P7-RELEASE bytes (clean builds of `-p listmngr` on this
# laptop): thin LTO, one codegen unit and stripped symbols take the binary
# from 52,987,616 to 36,120,624 bytes for 371 s -> 519 s of build time. A
# panic still names its file and line; a backtrace no longer names functions.
lto = "thin"
codegen-units = 1
strip = "symbols"

# The proc-macro dylibs a release build produces without debug info are
# refused by macOS 27's dyld ("mis-aligned LINKEDIT string pool"); keeping
# line tables in the build-override makes them loadable and changes nothing
# in the binary that ships (build scripts and proc macros only).
[profile.release.build-override]
debug = "line-tables-only"

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.test]
debug = "line-tables-only"
incremental = false
